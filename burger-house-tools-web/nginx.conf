server {
    listen 80;
    server_name burgerhousesmitools.com.br www.burgerhousesmitools.com.br _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://burgerhousesmitools.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name burgerhousesmitools.com.br www.burgerhousesmitools.com.br _;

    ssl_certificate /etc/letsencrypt/live/burgerhousesmitools.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/burgerhousesmitools.com.br/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy reverso para a API .NET
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy reverso para o Swagger da API
    location /swagger {
        proxy_pass http://api:8080/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
